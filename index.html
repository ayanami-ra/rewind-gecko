<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>回帰性家守</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    --bg: #111214;
    --panel: #26272b;
    --cream: #efe8d5;
    --gold: #f2c94c;
    --blue: #6fd3f2;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  html, body {
    height: 100%; margin: 0; background: var(--bg);
    font-family: "DotGothic16", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
    color: var(--cream); overflow: hidden; touch-action: none;
  }
  #app {
    height: 100%; display: flex; flex-direction: column; align-items: center;
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0px)) 10px;
    padding-top: calc(8px + env(safe-area-inset-top, 0px));
  }
  button { font-family: inherit; }
  #top {
    display: flex; justify-content: space-between; align-items: baseline;
    width: 100%; max-width: 460px; margin-bottom: 4px;
  }
  #title { font-size: 20px; letter-spacing: 0.08em; }
  #topRight { display: flex; align-items: baseline; gap: 10px; }
  #stageLabel { font-size: 15px; }
  #langBtn {
    background: transparent; color: var(--cream); border: 1px solid #4a4b50;
    border-radius: 5px; padding: 2px 8px; font-size: 12px; letter-spacing: 0.04em;
    cursor: pointer;
  }
  #langBtn:hover { border-color: var(--gold); color: var(--gold); }
  body.rewinding #langBtn { color: #1a1b1e; border-color: #a5a299; }
  body.rewinding #langBtn:hover { border-color: #1a1b1e; }
  #hud {
    display: flex; justify-content: space-between; align-items: center;
    width: 100%; max-width: 460px; font-size: 14px; margin-bottom: 6px;
  }
  #phase { font-size: 16px; letter-spacing: 0.06em; }
  #phase.rewind { color: var(--blue); }
  #phase.forward { color: var(--gold); }
  #counts { display: flex; gap: 14px; }
  .stat { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .dot.y { background: var(--cream); }
  .dot.b { background: var(--blue); box-shadow: 0 0 0 2px rgba(111,211,242,0.35); }
  body.rewinding #phase.rewind { color: #1f6f8a; }
  #boardWrap {
    position: relative; width: 100%; max-width: 460px; aspect-ratio: 1/1;
    border-radius: 12px; overflow: hidden;
    box-shadow: 0 0 0 2px #000, 0 8px 24px rgba(0,0,0,0.5);
  }
  canvas { display: block; width: 100%; height: 100%; }
  #msg {
    position: absolute; inset: 0; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    background: rgba(8,8,10,0.86); text-align: center; padding: 20px;
    transition: background 0.4s;
  }
  #msg.boot { justify-content: space-between; background: rgba(8,8,10,0.30); pointer-events: none; }
  #msg h2 { margin: 0 0 10px 0; font-size: 26px; font-weight: 400; letter-spacing: 0.06em; }
  #msg p { white-space: pre-line; margin: 0 0 16px 0; font-size: 14px; line-height: 1.75; max-width: 30em; }
  #msg button {
    background: var(--gold); color: #111; border: none; border-radius: 8px;
    padding: 10px 20px; font-size: 17px; letter-spacing: 0.08em;
  }
  #stickWrap {
    margin-top: 14px; display: flex; justify-content: center;
    width: 100%; max-width: 460px;
  }
  #stick {
    position: relative; width: 146px; height: 146px; border-radius: 50%;
    background: radial-gradient(circle at 50% 45%, #303137, #1b1c20 70%);
    border: 2px solid #3a3b40; box-shadow: inset 0 2px 10px rgba(0,0,0,0.6);
    touch-action: none; user-select: none; -webkit-user-select: none;
    transition: opacity 0.25s;
  }
  #stick.locked { opacity: 0.3; }
  #knob {
    position: absolute; left: 50%; top: 50%; width: 62px; height: 62px;
    margin: -31px 0 0 -31px; border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #f4efe0, #cdc6b2);
    box-shadow: 0 3px 8px rgba(0,0,0,0.5); pointer-events: none;
  }
  #stick.active #knob { background: radial-gradient(circle at 40% 35%, #ffe796, #e0b83c); }
  body.rewinding { background: #e9e6dc; }
  body.rewinding #app { color: #1a1b1e; }
  body.rewinding #boardWrap { box-shadow: 0 0 0 2px #fff, 0 8px 24px rgba(0,0,0,0.25); }
  body.rewinding #stick {
    background: radial-gradient(circle at 50% 45%, #d3d0c6, #b4b1a7 70%);
    border-color: #a5a299;
  }
  body.rewinding #knob { background: radial-gradient(circle at 40% 35%, #2b2c31, #17181b); }
  #app, body, #boardWrap, #stick, #knob { transition: background 3.8s, color 3.8s, box-shadow 3.8s; }
  #hint { margin-top: 10px; min-height: 1.6em; font-size: 14px; opacity: 0.85; text-align: center; line-height: 1.6; }
  #hud, #hint { display: none; }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div id="title">回帰性家守</div>
    <div id="topRight">
      <div id="stageLabel"><span id="stageWord">ステージ</span> <span id="stage">1</span></div>
      <button id="langBtn" type="button">EN</button>
    </div>
  </div>
  <div id="hud">
    <div id="phase" class="forward">▶ 前進</div>
    <div id="counts">
      <span class="stat"><i class="dot y"></i>ハエ <span id="wc">0/0</span></span>
      <span class="stat"><i class="dot b"></i>逆行ハエ <span id="bc">0/0</span></span>
    </div>
  </div>
  <div id="boardWrap">
    <canvas id="game"></canvas>
    <div id="msg">
      <h2 id="msgTitle"></h2>
      <p id="msgText"></p>
      <button id="msgBtn">スタート</button>
    </div>
  </div>
  <div id="stickWrap"><div id="stick"><div id="knob"></div></div></div>
  <div id="hint"></div>
</div>

<script>
(function () {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const phaseEl = document.getElementById('phase');
  const wcEl = document.getElementById('wc');
  const bcEl = document.getElementById('bc');
  const stageEl = document.getElementById('stage');
  const msgEl = document.getElementById('msg');
  const msgTitle = document.getElementById('msgTitle');
  const msgText = document.getElementById('msgText');
  const msgBtn = document.getElementById('msgBtn');
  const stickEl = document.getElementById('stick');
  const hintEl = document.getElementById('hint');
  const HINT = {
    idle: 'スティックを倒すと歩きだす',
    forward: '数字の秒に、青い影の口を逆行ハエへ',
    rewind: '',
    done: ''
  };
  const knobEl = document.getElementById('knob');
  const titleEl = document.getElementById('title');
  const stageWordEl = document.getElementById('stageWord');
  const langBtn = document.getElementById('langBtn');

  const STR = {
    ja: {
      title: '回帰性家守',
      stageWord: 'ステージ',
      start: 'スタート',
      pokeHint: '卵をつついてみよう',
      pokeMore: n => 'あと ' + n + ' 回',
      stageClearTitle: n => 'ステージ ' + n + ' クリア！',
      clearText: 'ハエも逆行ハエも、ぜんぶ食べきった！',
      hintStage3: 'ここからハエが跳びはじめる！',
      hintStageMore: 'ハエの跳ぶ間隔が、さらに短くなる',
      hintStage6: 'ここから盤が暗くなる。灯りの当たった先しか見えない',
      next: '次のステージへ',
      failTitle: '失敗…',
      failText: (whiteLeft, blueLeft) => {
        const miss = [];
        if (whiteLeft > 0) miss.push('ハエ ' + whiteLeft + '匹');
        if (blueLeft > 0) miss.push('逆行ハエ ' + blueLeft + '匹');
        return '食べ残し：' + miss.join('、');
      },
      retry: 'リトライ',
      langBtn: 'EN'
    },
    en: {
      title: 'Rewind Gecko',
      stageWord: 'Stage',
      start: 'Start',
      pokeHint: 'Tap the egg',
      pokeMore: n => n + ' more',
      stageClearTitle: n => 'Stage ' + n + ' Clear!',
      clearText: 'Every fly is eaten, forward and blue alike!',
      hintStage3: 'Flies start hopping from here!',
      hintStageMore: 'Flies now hop at shorter intervals',
      hintStage6: 'The board goes dark — you only see what the lights fall on',
      next: 'Next Stage',
      failTitle: 'Failed...',
      failText: (whiteLeft, blueLeft) => {
        const miss = [];
        if (whiteLeft > 0) miss.push(whiteLeft + (whiteLeft === 1 ? ' fly' : ' flies'));
        if (blueLeft > 0) miss.push(blueLeft + (blueLeft === 1 ? ' blue fly' : ' blue flies'));
        return 'Uneaten: ' + miss.join(', ');
      },
      retry: 'Retry',
      langBtn: '日本語'
    }
  };
  let lang = 'ja';
  let msgState = { kind: 'boot' };

  function renderMsg() {
    const s = STR[lang];
    msgEl.classList.toggle('boot', msgState.kind === 'boot');
    if (msgState.kind === 'boot') {
      msgTitle.textContent = s.title;
      msgText.textContent = pokes === 0 ? s.pokeHint : s.pokeMore(POKE_TARGET - pokes);
      msgBtn.style.display = 'none';
    } else if (msgState.kind === 'clear') {
      const cleared = msgState.clearedStage;
      msgTitle.textContent = s.stageClearTitle(cleared);
      let t = s.clearText;
      if (cleared === 2) t += '\n' + s.hintStage3;
      else if (cleared === 5) t += '\n' + s.hintStage6;
      else if (cleared >= 3) t += '\n' + s.hintStageMore;
      msgText.textContent = t;
      msgBtn.style.display = '';
      msgBtn.textContent = s.next;
    } else {
      msgBtn.style.display = '';
      msgTitle.textContent = s.failTitle;
      msgText.textContent = s.failText(msgState.whiteLeft, msgState.blueLeft);
      msgBtn.textContent = s.retry;
    }
  }

  function applyLang() {
    const s = STR[lang];
    titleEl.textContent = s.title;
    stageWordEl.textContent = s.stageWord;
    langBtn.textContent = s.langBtn;
    document.title = s.title;
    renderMsg();
  }

  langBtn.addEventListener('click', () => {
    lang = lang === 'ja' ? 'en' : 'ja';
    applyLang();
  });

    const fAng = Math.atan2(FWD[1], FWD[0]);
    const wrap = x => { x = (x + Math.PI) % (Math.PI * 2); if (x < 0) x += Math.PI * 2; return x - Math.PI; };
    Object.keys(GAIT).forEach(n => {
      const d = PART_DEFS.find(q => q.name === n);
      const g = GAIT[n];
      const vx = FOOT[n][0] - d.jx, vy = FOOT[n][1] - d.jy;
      g.vAng = Math.atan2(vy, vx);
      g.r = Math.hypot(vx, vy);                                   // sprite px
      const side = (FWD[0] * vy - FWD[1] * vx) >= 0 ? 1 : -1;      // which flank
      // splay the resting pose sideways like a sprawling reptile
      const target = (g.fore ? 86 : 94) * Math.PI / 180;
      let beta = wrap(fAng + side * target - g.vAng);
      beta = Math.max(-0.6, Math.min(0.6, beta));
      const restAng = g.vAng + beta;
      // shorten the resting reach so the stretch over a stride is symmetric around 1
      const q = (STRIDE / 2 / SPRITE_TO_CELL) / g.r;
      const restLen = g.r * (1 - q * q / 4);
      g.rest = [Math.cos(restAng) * restLen, Math.sin(restAng) * restLen];
      g.side = side;
      g.out = [-FWD[1] * side, FWD[0] * side];                      // outward normal
    });
  })();

  // Where the foot should be (relative to the shoulder/hip, sprite px) at gait fraction u.
  // During stance it moves straight back along the body at exactly the body's pace,
  // which is what keeps it pinned to the board.
  function footTarget(g, u) {
    u = u - Math.floor(u);
    const S = STRIDE / SPRITE_TO_CELL;
    let along, lift;
    if (u < DUTY) {
      along = (0.5 - u / DUTY) * S;
      lift = 0;
    } else {
      const v = (u - DUTY) / (1 - DUTY);
      const e = v * v * (3 - 2 * v);
      along = (-0.5 + e) * S;
      lift = Math.sin(Math.PI * v);
    }
    const bulge = lift * 0.16 * g.r;                               // swing arcs outward
    return {
      x: g.rest[0] + FWD[0] * along + g.out[0] * bulge,
      y: g.rest[1] + FWD[1] * along + g.out[1] * bulge,
      lift: lift
    };
  }

  const cSR = Math.cos(SPRITE_ROT), sSR = Math.sin(SPRITE_ROT);

  function bodyXform() {
    const th = gecko.angle + (gecko._wobble || 0);
    return { gx: gecko.x, gy: gecko.y, c: Math.cos(th), s: Math.sin(th) };
  }
  function spriteToWorld(px, py, T) {
    const dx = px - ORIGX, dy = py - ORIGY;
    const ax = (dx * cSR - dy * sSR) * SPRITE_TO_CELL;
    const ay = (dx * sSR + dy * cSR) * SPRITE_TO_CELL;
    return { x: T.gx + ax * T.c - ay * T.s, y: T.gy + ax * T.s + ay * T.c };
  }
  function worldToSprite(wx, wy, T) {
    const ax = wx - T.gx, ay = wy - T.gy;
    const bx = (ax * T.c + ay * T.s) / SPRITE_TO_CELL;
    const by = (-ax * T.s + ay * T.c) / SPRITE_TO_CELL;
    return { x: ORIGX + bx * cSR + by * sSR, y: ORIGY - bx * sSR + by * cSR };
  }
  function allPlanted(ph) {
    const p = ph / (Math.PI * 2);
    return Object.keys(GAIT).every(n => {
      const u = p + GAIT[n].off;
      return (u - Math.floor(u)) < DUTY;
    });
  }

  // A planted foot is pinned to a spot on the board. Each frame the limb is aimed
  // and stretched so the foot stays exactly on that spot, whatever the body does.
  // Lifted feet travel through the air to the next landing point, then pin again.
  // Comfortable range for a planted limb, measured from its resting pose.
  const REACH_ANG = 0.95;        // radians of twist before the foot must re-step
  const REACH_MIN = 0.64, REACH_MAX = 1.42;
  const HARD_ANG = 1.15;         // a limb is never drawn beyond this, whatever happens
  const QUICK_STEP = 0.14;       // progress per frame of an emergency step (~7 frames)

  function wrapAng(x) {
    x = (x + Math.PI) % (Math.PI * 2);
    if (x < 0) x += Math.PI * 2;
    return x - Math.PI;
  }
  function restAngle(g) { return Math.atan2(g.rest[1], g.rest[0]); }
  function outOfReach(g, fx, fy) {
    const dev = Math.abs(wrapAng(Math.atan2(fy, fx) - restAngle(g)));
    const sc = Math.hypot(fx, fy) / g.r;
    const side = (FWD[0] * fy - FWD[1] * fx) * g.side;     // < 0 means across the body
    return dev > REACH_ANG || sc < REACH_MIN || sc > REACH_MAX || side < 0;
  }

  // A planted foot is pinned to a spot on the board. Each frame the limb is aimed
  // and stretched so the foot stays exactly on that spot, whatever the body does.
  // Lifted feet travel through the air to the next landing point, then pin again.
  // If the body drags a planted foot out of comfortable reach (a wall, a spin,
  // a sudden reversal) it takes a quick step back under the body instead of twisting.
  function solveFeet(ph, T) {
    const p = ph / (Math.PI * 2);
    if (gecko._lastP !== undefined && Math.abs(p - gecko._lastP) > 1e-7) {
      gecko._dir = p > gecko._lastP ? 1 : -1;
    }
    const dir = gecko._dir || 1;
    gecko._lastP = p;
    const S = STRIDE / SPRITE_TO_CELL;
    if (!gecko.feet) gecko.feet = {};
    const out = {};

    Object.keys(GAIT).forEach(n => {
      const g = GAIT[n], d = PARTS[n];
      const u = p + g.off;
      const uf = u - Math.floor(u);
      const planted = uf < DUTY;
      let F = gecko.feet[n];

      if (!F) {
        const ft = footTarget(g, u);
        F = gecko.feet[n] = { stance: planted, dir: dir, quick: -1 };
        if (planted) {
          const w = spriteToWorld(d.jx + ft.x, d.jy + ft.y, T);
          F.wx = w.x; F.wy = w.y;
        } else {
          F.sx = ft.x; F.sy = ft.y;
        }
      }

      let fx, fy, lift = 0;

      if (F.quick >= 0) {
        // emergency step: time-driven, lands back at the resting spot
        F.quick = Math.min(1, F.quick + QUICK_STEP);
        const e = F.quick * F.quick * (3 - 2 * F.quick);
        lift = Math.sin(Math.PI * F.quick);
        const bulge = lift * 0.12 * g.r;
        fx = F.sx + (g.rest[0] - F.sx) * e + g.out[0] * bulge;
        fy = F.sy + (g.rest[1] - F.sy) * e + g.out[1] * bulge;
        if (F.quick >= 1) {
          const w = spriteToWorld(d.jx + g.rest[0], d.jy + g.rest[1], T);
          F.wx = w.x; F.wy = w.y; F.stance = true; F.quick = -1;
          F.syncWait = !planted;       // let the gait catch up before a normal lift-off
        }
        out[n] = { x: fx, y: fy, lift: lift };
        return;
      }

      if (F.syncWait && planted) F.syncWait = false;

      if (planted && !F.stance) {
        // touchdown: pin the foot where the swing delivered it
        const ex = g.rest[0] + FWD[0] * S * 0.5 * F.dir;
        const ey = g.rest[1] + FWD[1] * S * 0.5 * F.dir;
        const w = spriteToWorld(d.jx + ex, d.jy + ey, T);
        F.wx = w.x; F.wy = w.y; F.stance = true;
      } else if (!planted && F.stance && !F.syncWait) {
        // lift-off: start the swing from wherever the pinned foot now sits
        const q = worldToSprite(F.wx, F.wy, T);
        F.sx = q.x - d.jx; F.sy = q.y - d.jy; F.stance = false; F.dir = dir;
      }

      if (F.stance) {
        const q = worldToSprite(F.wx, F.wy, T);
        fx = q.x - d.jx; fy = q.y - d.jy;
        if (outOfReach(g, fx, fy)) {
          // start from where the limb can still be drawn sensibly
          const lim = clampPose(g, fx, fy);
          F.sx = lim.x; F.sy = lim.y; F.quick = 0; F.stance = false;
          fx = lim.x; fy = lim.y;
        }
      } else {
        const v = (uf - DUTY) / (1 - DUTY);
        const prog = F.dir > 0 ? v : 1 - v;
        const e = prog * prog * (3 - 2 * prog);
        const ex = g.rest[0] + FWD[0] * S * 0.5 * F.dir;
        const ey = g.rest[1] + FWD[1] * S * 0.5 * F.dir;
        lift = Math.sin(Math.PI * prog);
        const bulge = lift * 0.16 * g.r;
        fx = F.sx + (ex - F.sx) * e + g.out[0] * bulge;
        fy = F.sy + (ey - F.sy) * e + g.out[1] * bulge;
      }
      const c = clampPose(g, fx, fy);
      out[n] = { x: c.x, y: c.y, lift: lift };
    });
    return out;
  }

  // never let a limb be drawn twisted across the body or wildly stretched
  function clampPose(g, fx, fy) {
    const ra = restAngle(g);
    let dev = wrapAng(Math.atan2(fy, fx) - ra);
    dev = Math.max(-HARD_ANG, Math.min(HARD_ANG, dev));
    let len = Math.hypot(fx, fy);
    len = Math.max(REACH_MIN * g.r, Math.min(REACH_MAX * g.r, len));
    const ang = ra + dev;
    return { x: Math.cos(ang) * len, y: Math.sin(ang) * len };
  }

  let dctx = ctx;               // where the gecko renderer draws
  function pivotRotate(p, ang) {
    dctx.translate(p.jx - ORIGX, p.jy - ORIGY);
    dctx.rotate(ang);
    dctx.translate(-(p.jx - ORIGX), -(p.jy - ORIGY));
  }
  function blit(p) {
    if (!p.img.complete || !p.img.naturalWidth) return;
    dctx.drawImage(p.img, p.x - ORIGX, p.y - ORIGY, p.w, p.h);
  }
  // tail links, base to tip: the wave grows and lags further back along the tail
  const TAIL_CHAIN = [
    { name: 'tail1', amp: 0.13, lag: 0.85 },
    { name: 'tail2', amp: 0.17, lag: 1.70 },
    { name: 'tail3', amp: 0.20, lag: 2.55 },
    { name: 'tail4', amp: 0.20, lag: 3.40 }
  ];

  function drawTail(i, phase, amt) {
    if (i >= TAIL_CHAIN.length) return;
    const link = TAIL_CHAIN[i];
    const p = PARTS[link.name];
    dctx.save();
    pivotRotate(p, Math.sin(phase - link.lag) * link.amp * amt);
    drawTail(i + 1, phase, amt);
    blit(p);
    dctx.restore();
  }
  // work out this frame's pose once (feet are stateful, so never solve twice a frame)
  function poseGecko() {
    if (partsLoaded < PART_DEFS.length || !gecko) return null;
    const ph = gecko.walkPhase || 0;
    const sw = gecko.swing || 0;
    const wobble = Math.sin(ph) * 0.012 * sw;
    gecko._wobble = wobble;
    // a jump (stage start, or the mirrored rewind taking over) re-plants every foot
    if (gecko._lx === undefined || Math.hypot(gecko.x - gecko._lx, gecko.y - gecko._ly) > 1.0) {
      gecko.feet = null;
    }
    gecko._lx = gecko.x; gecko._ly = gecko.y;
    return { x: gecko.x, y: gecko.y, angle: gecko.angle + wobble, ph: ph,
             amt: 0.22 + 0.78 * sw, feet: solveFeet(ph, bodyXform()) };
  }

  function renderGecko(pose) {
    const s = (cellSize * 2.2) / 330;
    const ph = pose.ph, amt = pose.amt;
    dctx.save();
    dctx.translate((pose.x + 0.5) * cellSize, (pose.y + 0.5) * cellSize);
    dctx.rotate(pose.angle);
    dctx.scale(s, s);
    dctx.rotate(SPRITE_ROT);
    drawTail(0, ph, amt);

    dctx.save();
    pivotRotate(PARTS.head, Math.sin(ph + 0.9) * -0.13 * amt);
    blit(PARTS.head);
    dctx.restore();
    // torso over head and tail: its round caps close the neck and tail joints
    blit(PARTS.torso);
    // limbs over the torso; their roots fade into the body, so no seam shows
    ['FL', 'FR', 'RL', 'RR'].forEach(n => {
      const p = PARTS[n];
      const g = GAIT[n];
      const ft = pose.feet[n];
      const ang = Math.atan2(ft.y, ft.x) - g.vAng;
      let sc = Math.hypot(ft.x, ft.y) / g.r;
      sc = Math.max(0.66, Math.min(1.40, sc)) * (1 + ft.lift * 0.07);
      dctx.save();
      dctx.translate(p.jx - ORIGX, p.jy - ORIGY);
      dctx.rotate(ang);
      dctx.scale(sc, sc);
      dctx.translate(-(p.jx - ORIGX), -(p.jy - ORIGY));
      blit(p);
      dctx.restore();
    });
    dctx.restore();
  }

  function drawGecko() {
    const pose = poseGecko();
    if (pose) renderGecko(pose);
    return pose;
  }

  // The rewind replays the route point-mirrored through the board's centre, which
  // is the same as turning the whole scene half a turn about that centre. So the
  // ghost is simply this frame's gecko, redrawn rotated 180 degrees, pale and see-through.
  const ghostCv = document.createElement('canvas');
  const gctx = ghostCv.getContext('2d');
  function drawGhost(pose, now) {
    if (!pose || phase !== 'forward') return;
    if (ghostCv.width !== canvas.width || ghostCv.height !== canvas.height) {
      ghostCv.width = canvas.width; ghostCv.height = canvas.height;
    }
    const dpr = canvas.width / Math.max(1, boardPx);
    gctx.setTransform(1, 0, 0, 1, 0, 0);
    gctx.globalCompositeOperation = 'source-over';
    gctx.clearRect(0, 0, ghostCv.width, ghostCv.height);
    gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const c = boardPx / 2;
    gctx.translate(c, c); gctx.rotate(Math.PI); gctx.translate(-c, -c);
    dctx = gctx;
    renderGecko(pose);
    dctx = ctx;
    // wash it in a cold, pale blue
    gctx.setTransform(1, 0, 0, 1, 0, 0);
    gctx.globalCompositeOperation = 'source-atop';
    gctx.fillStyle = 'rgba(165,228,255,0.78)';
    gctx.fillRect(0, 0, ghostCv.width, ghostCv.height);
    gctx.globalCompositeOperation = 'source-over';

    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 0.40 + 0.10 * Math.sin(now / 420);      // a slow, faint flicker
    ctx.shadowColor = 'rgba(111,211,242,0.9)';
    ctx.shadowBlur = Math.max(4, cellSize * 0.35) * dpr;
    ctx.drawImage(ghostCv, 0, 0);
    ctx.restore();
  }

  // ================= game state =================
  const SPEED = 2.6;           // a pace those short legs can actually carry
  const TURN_SPEED = 9;
  const MAX_STEP_HZ = 6.5;       // gait cycles per second, at most
  const EAT_R = 0.8;          // caught by the mouth, not the middle of the body
  const MOUTH = 0.7;          // how far ahead of the body anchor the head sits
  const BLUE_WINDOW = 1.1;    // seconds of slack around a blue fly's timestamp

  let stage = 1;
  let phase = 'idle';         // idle | hatch | forward | rewind | done
  let clock = 0;              // seconds elapsed in the current phase
  let duration = 14;          // length of the forward phase
  let gecko = null;
  let track = [];             // recorded path: {t,x,y,a,p}
  let whites = [];
  let blues = [];
  let lastFrame = 0;
  let hatchStart = 0;
  let rafId = 0;         // only one animation-frame chain may ever be pending
  function scheduleFrame() {
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(loop);
  }
  const HATCH_SHAKE = 550;    // ms: the egg trembles, cracks glowing brighter
  const HATCH_BURST = 950;    // ms: the shell crumbles away pixel by pixel
  const HATCH_SETTLE = 220;   // ms: a beat to look at the gecko before play begins
  const HATCH_TOTAL = HATCH_SHAKE + HATCH_BURST + HATCH_SETTLE;
  let erosion = 0;       // 0 = normal, 1 = the negative has taken the whole board
  let seeds = [];        // where the inversion starts creeping from

  const pressed = { up: false, down: false, left: false, right: false };
  const stick = { x: 0, y: 0, active: false, id: null };

  let boardPx = 1;

  function resize() {
    const size = document.getElementById('boardWrap').clientWidth;
    cellSize = size / GRID;
    boardPx = size;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = size * dpr; canvas.height = size * dpr;
    canvas.style.width = size + 'px'; canvas.style.height = size + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function farEnough(x, y, list, min) {
    return list.every(f => Math.hypot(f.x - x, f.y - y) > min);
  }

  // Flies start hopping from stage 3; hops come sooner and reach further each stage.
  // A fly's position is a pure function of the clock, so during the rewind it hops
  // backwards along the same schedule and is exactly where it was at every second.
  const HOP_DUR = 0.38;
  const FLY_HEAD = -1.07;      // direction the head points in the sprite (radians)
  function hopLevel() { return Math.max(0, stage - 2); }

  function planHops(f, isBlue) {
    f.x0 = f.x; f.y0 = f.y; f.rot0 = f.rot;
    f.hops = [];
    const lv = hopLevel();
    if (!lv) return;
    const gap = Math.max(1.5, 4.2 - 0.55 * lv);          // seconds between hops, on average
    const reach = Math.min(3.0, 1.1 + 0.35 * lv);         // cells per hop, at most
    let x = f.x, y = f.y;
    let t = 0.6 + Math.random() * gap;
    while (t < duration - 0.2) {
      if (isBlue) {
        // stay put around its own moment so the target doesn't leap away
        const lo = f.t - BLUE_WINDOW - 0.3, hi = f.t + BLUE_WINDOW + 0.3;
        if (t + HOP_DUR > lo && t < hi) { t = hi; continue; }
      }
      let nx, ny, tries = 0;
      do {
        const a = Math.random() * Math.PI * 2;
        const d = reach * (0.55 + Math.random() * 0.45);
        nx = x + Math.cos(a) * d; ny = y + Math.sin(a) * d;
        tries++;
      } while ((nx < 0.8 || ny < 0.8 || nx > GRID - 1.8 || ny > GRID - 1.8) && tries < 20);
      nx = Math.min(GRID - 1.8, Math.max(0.8, nx));
      ny = Math.min(GRID - 1.8, Math.max(0.8, ny));
      f.hops.push({ t0: t, t1: t + HOP_DUR, x0: x, y0: y, x1: nx, y1: ny,
                    rot: Math.atan2(ny - y, nx - x) - FLY_HEAD });
      x = nx; y = ny;
      t += HOP_DUR + gap * (0.6 + Math.random() * 0.8);
    }
  }

  // where a fly is at time t: position, height of the hop (0..1), heading
  function flyAt(f, t) {
    let x = f.x0, y = f.y0, rot = f.rot0;
    for (const h of f.hops) {
      if (t < h.t0) break;
      if (t < h.t1) {
        const u = (t - h.t0) / (h.t1 - h.t0);
        const e = u * u * (3 - 2 * u);
        return { x: h.x0 + (h.x1 - h.x0) * e, y: h.y0 + (h.y1 - h.y0) * e,
                 lift: Math.sin(Math.PI * u), rot: h.rot };
      }
      x = h.x1; y = h.y1; rot = h.rot;
    }
    return { x: x, y: y, lift: 0, rot: rot };
  }

  function buildStage() {
    const nWhite = Math.min(3 + stage, 7);
    const nBlue = Math.min(1 + Math.floor(stage / 2), 4);
    duration = 12 + nBlue * 2;

    whites = []; blues = [];
    const all = [];
    const place = () => {
      let x, y, tries = 0;
      do {
        x = 1 + Math.random() * (GRID - 3);
        y = 1 + Math.random() * (GRID - 3);
        tries++;
      } while (!farEnough(x, y, all, 1.8) && tries < 60);
      return { x: x, y: y };
    };
    for (let i = 0; i < nWhite; i++) {
      const p = place(); p.eaten = false; p.rot = Math.random() * Math.PI * 2; p.seed = Math.random() * 100;
      whites.push(p); all.push(p);
    }
    for (let i = 0; i < nBlue; i++) {
      const p = place();
      p.eaten = false; p.locked = false; p.rot = Math.random() * Math.PI * 2; p.seed = Math.random() * 100;
      // spread the target times evenly across the run, with a little jitter
      p.t = 1.8 + (duration - 3.6) * ((i + 0.5) / nBlue) + (Math.random() - 0.5) * 1.2;
      blues.push(p); all.push(p);
    }
    blues.sort((a, b) => a.t - b.t);
    whites.forEach(f => planHops(f, false));
    blues.forEach(f => planHops(f, true));

    gecko = { x: GRID / 2, y: GRID / 2, angle: 0, targetAngle: 0,
              moving: false, walkPhase: 0, swing: 0 };
    track = [{ t: 0, x: gecko.x, y: gecko.y, a: 0, p: 0 }];
    clock = 0;
    buildLights();
    stageEl.textContent = stage;
    updateCounts();
  }

  function updateCounts() {
    wcEl.textContent = whites.filter(f => f.eaten).length + '/' + whites.length;
    bcEl.textContent = blues.filter(f => f.eaten).length + '/' + blues.length;
  }

  function startForward() {
    phase = 'forward';
    phaseEl.textContent = '▶ 前進';
    hintEl.textContent = HINT.forward;
    phaseEl.className = 'forward';
    erosion = 0; seeds = [];
    document.body.classList.remove('rewinding');
    stickEl.classList.remove('locked');
    msgEl.style.display = 'none';
    lastFrame = 0;
    scheduleFrame();
  }

  function startHatch() {
    buildStage();
    phase = 'hatch';
    hatchStart = 0;
    msgEl.style.display = 'none';
    scheduleFrame();
  }

  function startRewind() {
    phase = 'rewind';
    clock = duration;
    phaseEl.textContent = '◀◀ 逆行';
    hintEl.textContent = HINT.rewind;
    phaseEl.className = 'rewind';
    stickEl.classList.add('locked');
    document.body.classList.add('rewinding');
    // the inversion starts at the gecko and creeps outward, with a few side blooms
    const makeSeed = (x, y, delay, reach) => {
      const sd = { x: x, y: y, delay: delay, reach: reach,
                   a: Math.random() * 6.3, b: Math.random() * 6.3, c: Math.random() * 6.3,
                   tendrils: [], specks: [] };
      const nT = 6 + Math.floor(Math.random() * 4);
      for (let i = 0; i < nT; i++) {
        sd.tendrils.push({ ang: Math.random() * Math.PI * 2, len: 0.4 + Math.random() * 0.8,
                           w: 0.5 + Math.random() * 0.9, ph: Math.random() * 6.3 });
      }
      for (let i = 0; i < 22; i++) {
        sd.specks.push({ ang: Math.random() * Math.PI * 2, d: 0.12 + Math.random() * 0.85,
                         r: 0.08 + Math.random() * 0.26 });
      }
      return sd;
    };
    seeds = [makeSeed(gecko.x, gecko.y, 0, 1)];
    for (let i = 0; i < 4; i++) {
      seeds.push(makeSeed(Math.random() * GRID, Math.random() * GRID,
                          0.08 + Math.random() * 0.50, 0.32 + Math.random() * 0.24));
    }
    erosion = 0;
    releaseStick();
  }

  function finish() {
    phase = 'done';
    hintEl.textContent = HINT.done;
    const okW = whites.every(f => f.eaten);
    const okB = blues.every(f => f.eaten);
    if (okW && okB) {
      msgState = { kind: 'clear', clearedStage: stage };
      stage++;
    } else {
      msgState = {
        kind: 'fail',
        whiteLeft: whites.filter(f => !f.eaten).length,
        blueLeft: blues.filter(f => !f.eaten).length
      };
    }
    renderMsg();
    msgEl.style.display = 'flex';
  }

  // the rewind runs the route point-mirrored through the middle of the board
  function mirrorX(x) { return (GRID - 1) - x; }
  function mirrorY(y) { return (GRID - 1) - y; }

  function mouthPos(g) {
    return { x: g.x + Math.sin(g.angle) * MOUTH, y: g.y - Math.cos(g.angle) * MOUTH };
  }

  function shortestAngleDiff(from, to) {
    let d = (to - from) % (Math.PI * 2);
    if (d > Math.PI) d -= Math.PI * 2;
    if (d < -Math.PI) d += Math.PI * 2;
    return d;
  }

  function sampleTrack(t) {
    if (track.length === 0) return null;
    if (t <= track[0].t) return track[0];
    if (t >= track[track.length - 1].t) return track[track.length - 1];
    let lo = 0, hi = track.length - 1;
    while (hi - lo > 1) {
      const mid = (lo + hi) >> 1;
      if (track[mid].t <= t) lo = mid; else hi = mid;
    }
    const A = track[lo], B = track[hi];
    const k = (t - A.t) / Math.max(1e-6, B.t - A.t);
    return {
      t: t,
      x: A.x + (B.x - A.x) * k,
      y: A.y + (B.y - A.y) * k,
      a: A.a + shortestAngleDiff(A.a, B.a) * k,
      p: A.p + (B.p - A.p) * k
    };
  }

  function updateForward(dt) {
    const prevX = gecko.x, prevY = gecko.y;
    let dx = 0, dy = 0;
    if (pressed.up) dy -= 1;
    if (pressed.down) dy += 1;
    if (pressed.left) dx -= 1;
    if (pressed.right) dx += 1;
    if (dx || dy) { const l = Math.hypot(dx, dy); dx /= l; dy /= l; }
    else { dx = stick.x; dy = stick.y; }

    let mag = Math.min(1, Math.hypot(dx, dy));
    gecko.moving = mag > 0.02;

    if (gecko.moving) {
      let ux = dx / mag, uy = dy / mag;
      // pressed against a wall: turn to walk along it rather than shove sideways
      const pad = 0.15, near = 0.06;
      if ((gecko.x <= -pad + near && ux < 0) || (gecko.x >= GRID - 1 + pad - near && ux > 0)) ux = 0;
      if ((gecko.y <= -pad + near && uy < 0) || (gecko.y >= GRID - 1 + pad - near && uy > 0)) uy = 0;
      const l = Math.hypot(ux, uy);
      if (l < 0.25) { mag = 0; gecko.moving = false; }       // pushing straight into the wall
      else { ux /= l; uy /= l; mag *= Math.min(1, l * 1.2); gecko.targetAngle = Math.atan2(ux, -uy); }
    } else mag = 0;

    gecko.swing += (mag - gecko.swing) * (1 - Math.exp(-8 * dt));
    const turn = shortestAngleDiff(gecko.angle, gecko.targetAngle) * (1 - Math.exp(-TURN_SPEED * dt));
    gecko.angle += turn;

    if (gecko.moving) {
      // walk the way the body faces (never crab sideways), easing off while turning hard
      const align = Math.cos(shortestAngleDiff(gecko.angle, gecko.targetAngle));
      const pace = SPEED * mag * Math.max(0.2, align);
      gecko.x += Math.sin(gecko.angle) * pace * dt;
      gecko.y -= Math.cos(gecko.angle) * pace * dt;
      const pad = 0.15;
      gecko.x = Math.min(GRID - 1 + pad, Math.max(-pad, gecko.x));
      gecko.y = Math.min(GRID - 1 + pad, Math.max(-pad, gecko.y));
    }
    // one gait cycle per CYCLE_LEN of travel, so planted feet stay put on the board,
    // but never faster than a real gecko can step (spins no longer make the legs flicker)
    const travelled = Math.hypot(gecko.x - prevX, gecko.y - prevY) + Math.abs(turn) * 0.9;
    const dPhase = Math.min((travelled / CYCLE_LEN) * Math.PI * 2, MAX_STEP_HZ * Math.PI * 2 * dt);
    gecko.walkPhase += dPhase;
    if (!gecko.moving && Math.abs(turn) < 1e-4 && !allPlanted(gecko.walkPhase)) {
      gecko.walkPhase += dt * 5;     // finish the step in place; planted feet stay pinned
    }

    clock += dt;
    track.push({ t: clock, x: gecko.x, y: gecko.y, a: gecko.angle, p: gecko.walkPhase });

    const m = mouthPos(gecko);

    // white flies are caught by position alone
    whites.forEach(f => {
      const fp = flyAt(f, clock);
      if (!f.eaten && Math.hypot(fp.x - m.x, fp.y - m.y) < EAT_R) {
        f.eaten = true; updateCounts();
      }
    });

    // blue flies are judged against the mirrored route, not where you actually are
    const gm = { x: mirrorX(m.x), y: mirrorY(m.y) };
    blues.forEach(f => {
      if (!f.locked && Math.abs(clock - f.t) < BLUE_WINDOW &&
          Math.hypot(flyAt(f, clock).x - gm.x, flyAt(f, clock).y - gm.y) < EAT_R) {
        f.locked = true;
      }
    });

    if (clock >= duration) startRewind();
  }

  function updateRewind(dt) {
    clock -= dt;
    const s = sampleTrack(Math.max(0, clock));
    if (s) {
      const prev = { x: gecko.x, y: gecko.y };
      gecko.x = mirrorX(s.x); gecko.y = mirrorY(s.y);
      gecko.angle = s.a + Math.PI; gecko.walkPhase = s.p;
      const moved = Math.hypot(gecko.x - prev.x, gecko.y - prev.y) / Math.max(dt, 1e-6);
      gecko.swing = Math.min(1, moved / SPEED);
      gecko.moving = gecko.swing > 0.05;
    }
    // blue flies need the right place AND the right moment
    const m = mouthPos(gecko);
    blues.forEach(f => {
      if (f.eaten) return;
      const inWindow = Math.abs(clock - f.t) < BLUE_WINDOW;
      const fp = flyAt(f, clock);
      if (inWindow && (f.locked || Math.hypot(fp.x - m.x, fp.y - m.y) < EAT_R)) {
        f.eaten = true; updateCounts();
      }
    });
    if (clock <= 0) finish();
  }

  // ================= title egg =================
  // The shell is pixel art: a small grid where 0 is open air, 1 is the dark
  // inside of the shell and 2 is a pale line. Nothing here is drawn with
  // curves, so every edge stays on a whole pixel however large it is scaled.
  const EGG_W = 25, EGG_H = 34;
  const POKE_TARGET = 4;               // pokes the shell takes before it gives way

  const EGG_BANDS = [10, 19, 22];
  const EGG_DIAMONDS = [
    { x: 9, y: 6, r: 2 }, { x: 16, y: 6, r: 2 },
    { x: 5, y: 15, r: 2 }, { x: 19, y: 15, r: 2 },
    { x: 7, y: 27, r: 2 }, { x: 12, y: 27, r: 2 }, { x: 17, y: 27, r: 2 }
  ];
  const EGG_DOTS = [
    { x: 10, y: 15, r: 1.6 }, { x: 15, y: 15, r: 1.6 }
  ];
  // the fracture is drawn by hand so each poke opens a believable next stretch
  const EGG_SPLIT = [
    { x: 16, y: 1 }, { x: 15, y: 5 }, { x: 17, y: 9 }, { x: 15, y: 13 },
    { x: 16, y: 17 }, { x: 14, y: 21 }, { x: 15, y: 25 }, { x: 13, y: 29 },
    { x: 14, y: 33 }
  ];
  const EGG_BRANCHES = [
    { at: 2, pts: [{ x: 17, y: 9 }, { x: 20, y: 8 }, { x: 24, y: 10 }] },
    { at: 3, pts: [{ x: 16, y: 17 }, { x: 20, y: 18 }, { x: 24, y: 16 }] },
    { at: 4, pts: [{ x: 15, y: 25 }, { x: 19, y: 26 }, { x: 23, y: 24 }] }
  ];

  function eggInside(px, py) {
    const ex = (px + 0.5 - EGG_W / 2) / (EGG_W / 2);
    const ey = (py + 0.5 - EGG_H / 2) / (EGG_H / 2);
    const taper = ey < 0 ? 1 + 0.30 * ey : 1;   // narrower top, round bottom
    return (ex / taper) * (ex / taper) + ey * ey <= 1;
  }

  // paints one pixel, but only where there is shell to paint on
  function setShell(grid, x, y, code) {
    if (x < 0 || y < 0 || x >= EGG_W || y >= EGG_H) return;
    const i = y * EGG_W + x;
    if (grid[i] !== 0) grid[i] = code;
  }

  function stampBlob(grid, cx, cy, hit, code) {
    const r = 5;
    for (let y = cy - r; y <= cy + r; y++) {
      for (let x = cx - r; x <= cx + r; x++) {
        if (hit(x - cx, y - cy)) setShell(grid, x, y, code);
      }
    }
  }

  function tracePath(grid, pts, code, radius) {
    for (let i = 1; i < pts.length; i++) {
      const a = pts[i - 1], b = pts[i];
      const steps = Math.max(1, Math.round(Math.hypot(b.x - a.x, b.y - a.y) * 3));
      for (let s = 0; s <= steps; s++) {
        const cx = a.x + (b.x - a.x) * (s / steps);
        const cy = a.y + (b.y - a.y) * (s / steps);
        if (radius <= 0) { setShell(grid, Math.round(cx), Math.round(cy), code); continue; }
        for (let y = Math.floor(cy - radius); y <= cy + radius; y++) {
          for (let x = Math.floor(cx - radius); x <= cx + radius; x++) {
            if ((x - cx) * (x - cx) + (y - cy) * (y - cy) <= radius * radius) setShell(grid, x, y, code);
          }
        }
      }
    }
  }

  // one grid per number of pokes taken, so a strike just swaps which one is drawn
  function buildEggGrid(stage) {
    const g = new Uint8Array(EGG_W * EGG_H);
    for (let y = 0; y < EGG_H; y++) {
      for (let x = 0; x < EGG_W; x++) if (eggInside(x, y)) g[y * EGG_W + x] = 1;
    }

    // the rim, two pixels thick: each pass lights the outermost dark ring left
    const isGap = (x, y) =>
      x < 0 || y < 0 || x >= EGG_W || y >= EGG_H || g[y * EGG_W + x] !== 1;
    for (let pass = 0; pass < 2; pass++) {
      const rim = [];
      for (let y = 0; y < EGG_H; y++) {
        for (let x = 0; x < EGG_W; x++) {
          if (g[y * EGG_W + x] !== 1) continue;
          if (isGap(x - 1, y) || isGap(x + 1, y) || isGap(x, y - 1) || isGap(x, y + 1)) rim.push(y * EGG_W + x);
        }
      }
      rim.forEach(i => { g[i] = 2; });
    }

    EGG_BANDS.forEach(row => {
      for (let x = 0; x < EGG_W; x++) if (g[row * EGG_W + x] === 1) g[row * EGG_W + x] = 2;
    });
    EGG_DIAMONDS.forEach(d => stampBlob(g, d.x, d.y, (dx, dy) => Math.abs(dx) + Math.abs(dy) <= d.r, 2));
    EGG_DOTS.forEach(o => stampBlob(g, o.x, o.y, (dx, dy) => dx * dx + dy * dy <= o.r * o.r, 2));

    if (stage > 0) {
      const reach = 1 + Math.round((EGG_SPLIT.length - 1) * (stage / POKE_TARGET));
      const open = [EGG_SPLIT.slice(0, reach)];
      EGG_BRANCHES.forEach(b => { if (stage >= b.at) open.push(b.pts); });
      // clear a dark channel first so the break reads through any marking
      open.forEach(p => tracePath(g, p, 1, 1));
      open.forEach(p => tracePath(g, p, 2, 0));
    }
    return g;
  }

  const EGG_GRIDS = [];
  for (let s = 0; s <= POKE_TARGET; s++) EGG_GRIDS.push(buildEggGrid(s));

  // ---- the pale lines are lit through a stepped gradient that drifts and returns ----
  const EGG_RAMP = [
    [248, 241, 226], [250, 226, 160], [242, 201, 76],
    [216, 154, 58], [242, 201, 76], [250, 226, 160]
  ];
  const RAMP_STEPS = 8;                // how many flat colours the ramp collapses to
  const eggCv = document.createElement('canvas');
  eggCv.width = EGG_W; eggCv.height = EGG_H;
  const ectx = eggCv.getContext('2d');
  const eggImg = ectx.createImageData(EGG_W, EGG_H);

  function rampColor(v) {
    v -= Math.floor(v);
    v = Math.floor(v * RAMP_STEPS) / RAMP_STEPS;
    const f = v * EGG_RAMP.length;
    const i = Math.floor(f) % EGG_RAMP.length;
    const a = EGG_RAMP[i], b = EGG_RAMP[(i + 1) % EGG_RAMP.length];
    const k = f - Math.floor(f);
    return [
      Math.round(a[0] + (b[0] - a[0]) * k),
      Math.round(a[1] + (b[1] - a[1]) * k),
      Math.round(a[2] + (b[2] - a[2]) * k)
    ];
  }

  function paintEggPixels(grid, shift) {
    const d = eggImg.data;
    for (let y = 0; y < EGG_H; y++) {
      for (let x = 0; x < EGG_W; x++) {
        const o = (y * EGG_W + x) * 4;
        const code = grid[y * EGG_W + x];
        if (code === 0) { d[o + 3] = 0; continue; }
        if (code === 1) { d[o] = 11; d[o + 1] = 11; d[o + 2] = 13; d[o + 3] = 255; continue; }
        const u = (x / (EGG_W - 1)) * 0.5 + (y / (EGG_H - 1)) * 0.75;
        const c = rampColor(u - shift);
        d[o] = c[0]; d[o + 1] = c[1]; d[o + 2] = c[2]; d[o + 3] = 255;
      }
    }
    ectx.putImageData(eggImg, 0, 0);
  }

  // a shell pixel is a whole number of device pixels, so the art never resamples
  function eggPixelSize() {
    const dpr = canvas.width / Math.max(1, boardPx);
    return Math.max(1, Math.round(cellSize * 5.0 / EGG_H * dpr)) / dpr;
  }

  function drawEggPixels(cx, cy, scale, glow) {
    const dpr = canvas.width / Math.max(1, boardPx);
    const w = EGG_W * scale, h = EGG_H * scale;
    ctx.save();
    ctx.imageSmoothingEnabled = false;
    if (glow > 0) {
      ctx.shadowColor = 'rgba(242,201,76,0.85)';
      ctx.shadowBlur = cellSize * (0.04 + 0.16 * glow);
    }
    ctx.drawImage(eggCv, Math.round((cx - w / 2) * dpr) / dpr, Math.round((cy - h / 2) * dpr) / dpr, w, h);
    ctx.restore();
  }

  // whether a board-space point lands on the egg, for deciding what counts as a poke
  function eggHit(x, y) {
    const scale = eggPixelSize();
    return Math.abs(x - boardPx / 2) <= EGG_W * scale / 2
      && Math.abs(y - boardPx / 2) <= EGG_H * scale / 2;
  }

  let pokes = 0;
  let pokeAt = -1e9;                   // when the shell was last struck

  function drawEggIdle(now) {
    const scale = eggPixelSize();
    const jolt = Math.max(0, 1 - (now - pokeAt) / 300);
    // the wobble moves in whole pixels: rotating or easing would soften the edges
    const sway = Math.round(Math.sin(now / 780));
    const kick = Math.round(Math.sin((now - pokeAt) / 24) * 3 * jolt);
    const bob = Math.round(Math.sin(now / 900) + Math.sin((now - pokeAt) / 31) * 2 * jolt);
    paintEggPixels(EGG_GRIDS[Math.min(pokes, POKE_TARGET)], Math.sin(now / 1600) * 0.6);
    drawEggPixels(boardPx / 2 + (sway + kick) * scale, boardPx / 2 + bob * scale, scale, 0.25 * jolt);
  }

  function easeOutBack(x) {
    const c1 = 1.4, c3 = c1 + 1;
    return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
  }

  // ---- when the shell goes, it goes one pixel at a time, starting at the fracture ----
  const FALL_SPAN = 0.34;              // how much of the burst a single pixel's fall takes

  function splitColAt(py) {
    if (py <= EGG_SPLIT[0].y) return EGG_SPLIT[0].x;
    for (let i = 1; i < EGG_SPLIT.length; i++) {
      const a = EGG_SPLIT[i - 1], b = EGG_SPLIT[i];
      if (py <= b.y) return a.x + (b.x - a.x) * ((py - a.y) / (b.y - a.y));
    }
    return EGG_SPLIT[EGG_SPLIT.length - 1].x;
  }

  function splitDistance(px, py) {
    let best = Infinity;
    for (let i = 1; i < EGG_SPLIT.length; i++) {
      const a = EGG_SPLIT[i - 1], b = EGG_SPLIT[i];
      const dx = b.x - a.x, dy = b.y - a.y;
      const t = Math.max(0, Math.min(1, ((px - a.x) * dx + (py - a.y) * dy) / (dx * dx + dy * dy)));
      best = Math.min(best, Math.hypot(px - (a.x + dx * t), py - (a.y + dy * t)));
    }
    return best;
  }

  const EGG_FALL = (() => {
    const g = EGG_GRIDS[POKE_TARGET], out = [];
    for (let y = 0; y < EGG_H; y++) {
      for (let x = 0; x < EGG_W; x++) {
        if (!g[y * EGG_W + x]) continue;
        const side = x < splitColAt(y) ? -1 : 1;
        out.push({
          x, y,
          t0: (splitDistance(x, y) / 13) * 0.34 + (1 - y / EGG_H) * 0.26 + Math.random() * 0.06,
          vx: side * (0.3 + Math.random() * 1.1),
          lift: Math.random() * 1.3
        });
      }
    }
    return out;
  })();

  function drawEggCrumble(cx, cy, scale, p) {
    const dpr = canvas.width / Math.max(1, boardPx);
    const snap = v => Math.round(v * dpr) / dpr;
    const x0 = cx - EGG_W * scale / 2, y0 = cy - EGG_H * scale / 2;
    const d = eggImg.data;
    ctx.save();
    for (const q of EGG_FALL) {
      const f = (p - q.t0) / FALL_SPAN;
      if (f >= 1) continue;
      let px = x0 + q.x * scale, py = y0 + q.y * scale;
      if (f > 0) {
        px += q.vx * f * 6 * scale;
        py += (f * f * 34 - f * q.lift * 2) * scale;
        ctx.globalAlpha = 1 - f;
      } else {
        ctx.globalAlpha = 1;
      }
      const o = (q.y * EGG_W + q.x) * 4;
      ctx.fillStyle = 'rgb(' + d[o] + ',' + d[o + 1] + ',' + d[o + 2] + ')';
      ctx.fillRect(snap(px), snap(py), scale, scale);
    }
    ctx.restore();
  }

  function drawHatch(e) {
    const cx = boardPx / 2, cy = boardPx / 2;
    const scale = eggPixelSize();
    if (e < HATCH_SHAKE) {
      const p = e / HATCH_SHAKE;
      const kick = Math.round(Math.sin(e / 38) * (1 + 3 * p));
      const bob = Math.round(Math.sin(e / 52) * 2 * p);
      paintEggPixels(EGG_GRIDS[POKE_TARGET], -e / 600);   // the gradient races as the shell strains
      drawEggPixels(cx + kick * scale, cy + bob * scale, scale, 0.3 + 0.7 * p);
      return;
    }
    const p = Math.min(1, (e - HATCH_SHAKE) / HATCH_BURST);
    paintEggPixels(EGG_GRIDS[POKE_TARGET], -HATCH_SHAKE / 600);
    if (p < 0.2) {
      ctx.save();
      ctx.globalAlpha = (1 - p / 0.2) * 0.55;
      ctx.fillStyle = '#f2c94c';
      ctx.beginPath();
      ctx.arc(cx, cy, cellSize * 2.9, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    const emerge = Math.max(0.001, 0.08 + 0.92 * easeOutBack(Math.min(1, p / 0.6)));
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(emerge, emerge);
    ctx.translate(-cx, -cy);
    const pose = poseGecko();
    if (pose) renderGecko(pose);
    ctx.restore();
    drawEggCrumble(cx, cy, scale, p);
  }

  // ================= drawing =================
  function drawBoard() {
    for (let gx = 0; gx < GRID; gx++) {
      for (let gy = 0; gy < GRID; gy++) {
        ctx.fillStyle = (gx + gy) % 2 === 0 ? '#0d0d0e' : '#3a3b3e';
        ctx.fillRect(gx * cellSize, gy * cellSize, cellSize, cellSize);
      }
    }
  }

  function drawTrack() {
    if (track.length < 2) return;
    const seg = (from, to, style, width, mirror) => {
      let started = false;
      ctx.beginPath();
      for (let i = 0; i < track.length; i++) {
        const s0 = track[i];
        if (s0.t < from || s0.t > to) { started = false; continue; }
        const px = mirror ? mirrorX(s0.x) : s0.x;
        const py = mirror ? mirrorY(s0.y) : s0.y;
        const x = (px + 0.5) * cellSize, y = (py + 0.5) * cellSize;
        if (!started) { ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y);
      }
      ctx.strokeStyle = style;
      ctx.lineWidth = width;
      ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      ctx.stroke();
    };
    const w = Math.max(1.8, cellSize * 0.09);
    if (phase === 'rewind') {
      // the mirrored route is the one actually being retraced
      seg(clock, Infinity, 'rgba(120,120,130,0.20)', w * 0.7, true);
      seg(-Infinity, clock, 'rgba(20,20,24,0.95)', w, true);
    } else {
      seg(-Infinity, Infinity, 'rgba(242,201,76,0.22)', w * 0.8, false);
      // preview of where the rewind will actually run
      ctx.setLineDash([cellSize * 0.18, cellSize * 0.22]);
      seg(-Infinity, Infinity, 'rgba(111,211,242,0.55)', w * 0.85, true);
      ctx.setLineDash([]);
    }
  }

  // a fly sitting on the board: tiny restless shuffles and a buzz of the wings
  function drawFlySprite(img, f, now, size) {
    if (!img.complete || !img.naturalWidth) return;
    const t = now / 1000;
    const st = flyAt(f, clock);
    const gx = (st.x + 0.5) * cellSize, gy = (st.y + 0.5) * cellSize;
    if (st.lift > 0.01) {
      ctx.fillStyle = 'rgba(0,0,0,' + (0.35 * st.lift) + ')';
      ctx.beginPath();
      ctx.ellipse(gx, gy, size * 0.32, size * 0.18, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    const cx = gx + Math.sin(t * 2.3 + f.seed) * 0.03 * cellSize * (1 - st.lift);
    const cy = gy + Math.cos(t * 1.9 + f.seed) * 0.03 * cellSize * (1 - st.lift) - st.lift * cellSize * 0.55;
    const rot = st.rot + Math.sin(t * 1.3 + f.seed) * 0.12 * (1 - st.lift);
    const buzz = (1 + Math.sin(t * (38 + 40 * st.lift) + f.seed) * 0.035) ;
    size *= 1 + st.lift * 0.3;
    const h = size, w = size * img.naturalWidth / img.naturalHeight;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rot);
    ctx.scale(buzz, 1 / buzz);
    ctx.drawImage(img, -w / 2, -h / 2, w, h);
    ctx.restore();
  }

  function drawFlies(now) {
    whites.forEach(f => {
      if (f.eaten) return;
      drawFlySprite(FLY_IMG, f, now, cellSize * 0.95);
    });

    blues.forEach(f => {
      if (f.eaten) return;
      const fp = flyAt(f, clock);
      const cx = (fp.x + 0.5) * cellSize, cy = (fp.y + 0.5 - fp.lift * 0.55) * cellSize;
      const near = Math.abs(clock - f.t) < BLUE_WINDOW;
      if (near) {
        // its moment is now: a pulsing halo
        const pulse = 1 + Math.sin(now / 90) * 0.12;
        ctx.strokeStyle = 'rgba(159,232,255,0.9)';
        ctx.lineWidth = Math.max(1.2, cellSize * 0.06);
        ctx.beginPath();
        ctx.arc(cx, cy, cellSize * 0.58 * pulse, 0, Math.PI * 2);
        ctx.stroke();
      }
      drawFlySprite(FLY_BLUE_IMG, f, now, cellSize * 0.95);

      ctx.fillStyle = near ? '#e8faff' : 'rgba(180,230,245,0.85)';
      ctx.font = Math.round(cellSize * 0.36) + 'px ' + GAME_FONT;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(f.t.toFixed(1), cx, cy - cellSize * 0.66);
    });

  }

  function drawClock() {
    const rewinding = phase === 'rewind';
    const tint = rewinding ? '111,211,242' : '242,201,76';
    const label = clock.toFixed(1) + 's';
    const right = GRID * cellSize - cellSize * 0.25;
    const bottom = GRID * cellSize - cellSize * 0.1;
    ctx.font = Math.round(cellSize * 1.4) + 'px ' + GAME_FONT;
    ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
    ctx.fillStyle = 'rgba(' + tint + ',' + (rewinding ? 0.6 : 0.5) + ')';
    ctx.fillText(label, right, bottom);

    // how much of the phase is still to come, running along beside the number
    const w = cellSize * 5.2, h = cellSize * 0.42;
    const x = right - ctx.measureText(label).width - cellSize * 0.5 - w;
    const y = bottom - cellSize * 0.5 - h / 2;
    const remain = Math.max(0, Math.min(1, (rewinding ? clock : duration - clock) / duration));
    ctx.fillStyle = 'rgba(' + tint + ',0.16)';
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = 'rgba(' + tint + ',0.62)';
    ctx.fillRect(x, y, w * remain, h);
  }

  function stepEffects(dt) {
    if (phase === 'rewind') erosion = Math.min(1, erosion + dt / 4.8);
    stepLights(dt);
  }

  function angDiff(a, b) {
    let d = (a - b) % (Math.PI * 2);
    if (d > Math.PI) d -= Math.PI * 2;
    if (d < -Math.PI) d += Math.PI * 2;
    return d;
  }

  // one smooth closed outline per seed: low-frequency waves plus soft bulges
  // folded into the radius itself, traced with curves instead of straight segments
  function buildErosionPath(now) {
    const path = new Path2D();
    const diag = Math.hypot(boardPx, boardPx);
    const N = 160;
    seeds.forEach(sd => {
      const local = (erosion - sd.delay) / (1 - sd.delay);
      if (local <= 0) return;
      const e = Math.pow(local, 1.25);
      const R = e * (diag / 0.62) * sd.reach;
      if (R < 0.5) return;
      const sx = (sd.x + 0.5) * cellSize, sy = (sd.y + 0.5) * cellSize;

      const pts = [];
      for (let i = 0; i < N; i++) {
        const th = (i / N) * Math.PI * 2;
        let k = 1
          + 0.20 * Math.sin(3 * th + sd.a + now * 0.00045)
          + 0.12 * Math.sin(5 * th + sd.b - now * 0.00065)
          + 0.06 * Math.sin(8 * th + sd.c + now * 0.0009);
        sd.tendrils.forEach(td => {
          const d = angDiff(th, td.ang);
          const sig = 0.12 + 0.10 * td.w;
          const amp = td.len * 0.55 * (0.6 + 0.4 * Math.sin(now * 0.0008 + td.ph));
          k += amp * Math.exp(-(d * d) / (2 * sig * sig));
        });
        const r = R * k;
        pts.push([sx + Math.cos(th) * r, sy + Math.sin(th) * r]);
      }
      const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
      const start = mid(pts[N - 1], pts[0]);
      path.moveTo(start[0], start[1]);
      for (let i = 0; i < N; i++) {
        const cur = pts[i], nxt = pts[(i + 1) % N];
        const m = mid(cur, nxt);
        path.quadraticCurveTo(cur[0], cur[1], m[0], m[1]);
      }
      path.closePath();
    });
    return path;
  }

  // From DARK_STAGE on, the board is unlit: a few lights wander it at random and
  // only what they touch can be seen. The gecko carries a small one of its own,
  // otherwise there would be no way to steer between the sweeps.
  const DARK_STAGE = 6;
  const darkCv = document.createElement('canvas');
  const dkctx = darkCv.getContext('2d');
  let lights = [];

  function buildLights() {
    lights = stage < DARK_STAGE ? [] : Array.from({ length: 3 }, () => ({
      x: Math.random() * GRID, y: Math.random() * GRID,
      tx: Math.random() * GRID, ty: Math.random() * GRID,
      r: 1.9 + Math.random() * 1.1,
      speed: 0.9 + Math.random() * 0.9
    }));
  }

  function stepLights(dt) {
    lights.forEach(L => {
      const dx = L.tx - L.x, dy = L.ty - L.y;
      const d = Math.hypot(dx, dy);
      if (d < 0.3) { L.tx = Math.random() * GRID; L.ty = Math.random() * GRID; return; }
      L.x += (dx / d) * L.speed * dt;
      L.y += (dy / d) * L.speed * dt;
    });
  }

  function applyDarkness(pose) {
    if (!lights.length) return;
    if (darkCv.width !== canvas.width) { darkCv.width = canvas.width; darkCv.height = canvas.height; }
    const dpr = canvas.width / Math.max(1, boardPx);
    dkctx.setTransform(1, 0, 0, 1, 0, 0);
    dkctx.globalCompositeOperation = 'source-over';
    dkctx.fillStyle = '#000';
    dkctx.fillRect(0, 0, darkCv.width, darkCv.height);
    dkctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    dkctx.globalCompositeOperation = 'destination-out';
    const hole = (cx, cy, r) => {
      const g = dkctx.createRadialGradient(cx, cy, r * 0.4, cx, cy, r);
      g.addColorStop(0, 'rgba(0,0,0,1)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      dkctx.fillStyle = g;
      dkctx.beginPath();
      dkctx.arc(cx, cy, r, 0, Math.PI * 2);
      dkctx.fill();
    };
    lights.forEach(L => hole(L.x * cellSize, L.y * cellSize, L.r * cellSize));
    if (pose) hole(pose.x * cellSize, pose.y * cellSize, cellSize * 1.2);
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(darkCv, 0, 0);
    ctx.restore();
  }

  function invertRegion(path) {
    ctx.save();
    ctx.globalCompositeOperation = 'difference';
    ctx.fillStyle = '#fff';
    if (path) ctx.fill(path);
    else ctx.fillRect(0, 0, boardPx, boardPx);
    ctx.restore();
  }

  function applyInversion(now) {
    if (erosion <= 0.001) return;
    if (erosion >= 1) { invertRegion(null); return; }

    const path = buildErosionPath(now);
    invertRegion(path);
  }

  function draw(now) {
    drawBoard();
    if (phase === 'idle') { drawFlies(now); drawEggIdle(now); return; }
    if (phase === 'hatch') { drawHatch(now - hatchStart); return; }
    drawFlies(now);
    const pose = poseGecko();
    drawGhost(pose, now);
    if (pose) renderGecko(pose);
    applyDarkness(pose);
    drawClock();
    applyInversion(now);
  }

  function loop(t) {
    if (phase === 'idle') { draw(t); scheduleFrame(); return; }
    if (phase === 'hatch') {
      if (!hatchStart) hatchStart = t;
      if (t - hatchStart >= HATCH_TOTAL) { startForward(); return; }
      draw(t);
      scheduleFrame();
      return;
    }
    if (phase === 'done') {
      if (!lastFrame) lastFrame = t;
      lastFrame = t;
      draw(t);
      scheduleFrame();
      return;
    }
    if (!lastFrame) lastFrame = t;
    let dt = Math.min((t - lastFrame) / 1000, 0.05);
    lastFrame = t;
    if (phase === 'forward') updateForward(dt); else updateRewind(dt);
    stepEffects(dt);
    draw(t);
    scheduleFrame();
  }

  // ================= input =================
  const STICK_R = 52, DEADZONE = 0.14;
  function setStick(clientX, clientY) {
    if (phase !== 'forward') return;
    const r = stickEl.getBoundingClientRect();
    let dx = clientX - (r.left + r.width / 2);
    let dy = clientY - (r.top + r.height / 2);
    const len = Math.hypot(dx, dy);
    const clamped = Math.min(len, STICK_R);
    const nx = len ? dx / len : 0, ny = len ? dy / len : 0;
    knobEl.style.transform = 'translate(' + nx * clamped + 'px,' + ny * clamped + 'px)';
    let mag = clamped / STICK_R;
    if (mag < DEADZONE) { stick.x = 0; stick.y = 0; return; }
    mag = (mag - DEADZONE) / (1 - DEADZONE);
    stick.x = nx * mag; stick.y = ny * mag;
  }
  function releaseStick() {
    stick.active = false; stick.id = null; stick.x = 0; stick.y = 0;
    knobEl.style.transform = 'translate(0px,0px)';
    stickEl.classList.remove('active');
  }
  stickEl.addEventListener('touchstart', e => {
    e.preventDefault();
    const t = e.changedTouches[0];
    stick.active = true; stick.id = t.identifier;
    stickEl.classList.add('active'); setStick(t.clientX, t.clientY);
  }, { passive: false });
  stickEl.addEventListener('touchmove', e => {
    e.preventDefault();
    for (const t of e.changedTouches) if (t.identifier === stick.id) setStick(t.clientX, t.clientY);
  }, { passive: false });
  ['touchend', 'touchcancel'].forEach(ev => stickEl.addEventListener(ev, e => {
    e.preventDefault();
    for (const t of e.changedTouches) if (t.identifier === stick.id) releaseStick();
  }, { passive: false }));
  stickEl.addEventListener('mousedown', e => {
    e.preventDefault(); stick.active = true;
    stickEl.classList.add('active'); setStick(e.clientX, e.clientY);
  });
  window.addEventListener('mousemove', e => { if (stick.active) setStick(e.clientX, e.clientY); });
  window.addEventListener('mouseup', () => { if (stick.active) releaseStick(); });

  const keyMap = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
                   w: 'up', s: 'down', a: 'left', d: 'right' };
  window.addEventListener('keydown', e => {
    const d = keyMap[e.key]; if (d) { e.preventDefault(); pressed[d] = true; }
  });
  window.addEventListener('keyup', e => {
    const d = keyMap[e.key]; if (d) { e.preventDefault(); pressed[d] = false; }
  });

  msgBtn.addEventListener('click', () => { buildStage(); startForward(); });

  // the shell gives a little more each time it is struck, then breaks open
  canvas.addEventListener('pointerdown', e => {
    if (phase !== 'idle') return;
    const r = canvas.getBoundingClientRect();
    if (!eggHit((e.clientX - r.left) / r.width * boardPx, (e.clientY - r.top) / r.height * boardPx)) return;
    pokes++;
    pokeAt = performance.now();
    if (pokes >= POKE_TARGET) startHatch(); else renderMsg();
  });
  window.addEventListener('resize', resize);

  // ================= boot =================
  resize();
  buildStage();
  phase = 'idle';
  msgState = { kind: 'boot' };
  applyLang();
  hintEl.textContent = HINT.idle;
  msgEl.style.display = 'flex';
  scheduleFrame();
})();
</script>
</body>
</html>
